disable_scan_offload=1
wowlan_triggers=any
p2p_disabled=1
filter_rssi=-75
no_ctrl_interface=
# BCM4329 firmware (2012) cannot install the IGTK of 802.11w (WLC_SET_KEY -8):
# with PMF negotiated, APs offering it drop the connection after the 4-way
# handshake. Android 10 leaves non-PMF networks at this global default.
pmf=0
